name: Renovate

on:
  schedule:
    # Run daily shortly after the anubis upstream-sync workflow.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The go-mod manager runs go mod tidy; the forked Anubis module is
          # not on sum.golang.org, so mirror build.yml's module settings.
          GOPRIVATE: github.com/ToastyTheBot/*
          GONOSUMCHECK: github.com/ToastyTheBot/*,all
          GONOSUMDB: github.com/ToastyTheBot/*
          # Repository secret: a fine-grained PAT for the repo owner with
          # Contents (read/write), Pull requests (read/write), and
          # Workflows (read/write) so Renovate can open bump PRs.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
